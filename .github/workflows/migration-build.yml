name: Firebase Auth Migration Build

on:
  push:
    branches:
      - migration/firebase-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate genuine Firebase dependency lockfile
        run: npm install firebase@12.19.0 firebase-admin@14.5.0 --save
      - name: Verify clean dependency install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          FIREBASE_PROJECT_ID: build-check
          FIREBASE_CLIENT_EMAIL: build-check@example.invalid
          FIREBASE_PRIVATE_KEY: |
            -----BEGIN PRIVATE KEY-----
            BUILD_CHECK_PLACEHOLDER
            -----END PRIVATE KEY-----
          NEXT_PUBLIC_FIREBASE_API_KEY: build-check
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: build-check.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: build-check
          NEXT_PUBLIC_FIREBASE_APP_ID: build-check
          ADMIN_EMAIL: build-check@example.invalid
          RAZORPAY_KEY_ID: build-check
          RAZORPAY_KEY_SECRET: build-check
          NEXT_PUBLIC_RAZORPAY_KEY_ID: build-check
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-auth-dependencies
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
