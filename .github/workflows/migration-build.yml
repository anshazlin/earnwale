name: Migration Build Check

on:
  push:
    branches:
      - migration/firebase-firestore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          FIREBASE_PROJECT_ID: build-check
          FIREBASE_CLIENT_EMAIL: build-check@example.invalid
          FIREBASE_PRIVATE_KEY: |
            -----BEGIN PRIVATE KEY-----
            BUILD_CHECK_PLACEHOLDER
            -----END PRIVATE KEY-----
          JWT_SECRET: build-check-only
          ADMIN_EMAIL: build-check@example.invalid
          RAZORPAY_KEY_ID: build-check
          RAZORPAY_KEY_SECRET: build-check
          NEXT_PUBLIC_RAZORPAY_KEY_ID: build-check
