name: Firebase Auth Migration Build

on:
  push:
    branches:
      - migration/firebase-auth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate Firebase dependency lockfile
        run: npm install firebase firebase-admin --save
      - name: Verify clean install
        run: npm ci
      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: firebase-auth-dependencies
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
