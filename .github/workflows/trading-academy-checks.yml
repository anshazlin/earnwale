name: Trading Academy checks
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/trading-academy-checks.yml"
  workflow_dispatch:
jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # The repository's existing lockfile was out of sync with package.json.
      - name: Refresh lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --no-audit
      - name: Update feature-branch lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/trading-academy-20261011'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize lockfile with dependency manifest"
            git push origin HEAD:feature/trading-academy-20261011
          fi
      - run: npm test
      - run: npm run typecheck
      - name: Lint new and changed course frontend/routes
        run: npx eslint src/app/api/trading/quiz/route.ts src/app/api/trading/media/route.ts src/lib/trading-course.ts src/app/dashboard/my-courses/page.tsx src/app/page.tsx src/app/signup/SignupContent.tsx src/app/api/payment/create-order/route.ts src/app/admin/_components/sidebar.tsx src/app/admin/trading-assets/page.tsx src/app/api/admin/trading-assets/route.ts src/app/api/admin/trading-preview/route.ts src/lib/pro-course.ts src/lib/pro-questions.ts src/app/api/pro/quiz/route.ts src/app/api/pro/media/route.ts src/app/api/admin/pro-assets/route.ts src/app/api/admin/pro-preview/route.ts src/app/admin/pro-assets/page.tsx src/app/dashboard/pro/page.tsx src/app/dashboard/_components/dashboard-shell.tsx
      - name: Prepare ephemeral Firebase credentials for compile-only build
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/earnwale-ci.pem 2>/dev/null
          {
            echo 'FIREBASE_PRIVATE_KEY<<PEM'
            cat /tmp/earnwale-ci.pem
            echo PEM
          } >> "$GITHUB_ENV"
      - name: Build production Next.js bundle (no real provider calls)
        env:
          FIREBASE_PROJECT_ID: earnwale-ci-placeholder
          FIREBASE_CLIENT_EMAIL: ci@earnwale-ci-placeholder.iam.gserviceaccount.com
          RAZORPAY_KEY_ID: rzp_test_ci_placeholder
          RAZORPAY_KEY_SECRET: ci_placeholder_key_only
          EARNWALE_STARTER_ENROLLMENT_ENABLED: "false"
        run: npm run build
